# =========================================================================
# my_supermarket.ini
# -------------------------------------------------------------------------
# Standard configuration of the Supermarket Checkout System.
# Per the brief (§4.2), this file is loaded at startup so that the system
# contains at least the default configuration produced by the CLUI `setup`
# command. It is also runnable manually via:  runTest my_supermarket.ini
#
# All commands are CLUI commands; lines starting with '#' are comments.
# =========================================================================


# ---- 1. Manager logs in (ceo is assumed to exist per the brief) ----
login ceo 123456789


# ---- 2. Default catalogue: the three mandatory categories (R2b) ----
# addItem <name> <category>           <unitPrice> <weight-kg> <initialStock>
addItem apple   fruit-and-vegetables  1.20        0.20         50
addItem yogurt  dairy                 2.50        0.50         30
addItem chicken meat                  7.00        1.00         20


# ---- 3. Sample category-level pricing policy (R6) ----
# 10% reduction on fruit-and-vegetables.
setCategoryDiscount fruit-and-vegetables 10


# ---- 4. Register one default cashier and one default customer ----
registerCashier Default Cashier cashier 1111

# Address uses bracket form because it contains spaces.
registerCustomer Default Customer customer [1 default street] 2222


# ---- 5. Done. Manager logs out, system is ready ----
logout
